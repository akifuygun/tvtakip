# MySQL for local development, set like live's (hostUNO, MySQL 8.0).
# setup-dev.bat installs the MySQL version live runs and copies this file into
# it, as {dev}/mysql/my.ini, where the server and its command-line clients
# (mysql, mysqladmin, mysqldump) find it by themselves - run it again after
# changing anything here.
#
# Below "as live": the server variables live has set differently from a new
# MySQL 8.0 of the same version (SHOW GLOBAL VARIABLES on both, compared on
# 2026-11-20), as far as they change what a query does - or how fast it is
# and what memory it takes, where that was cheap to copy. Not copied, being
# about the machine or the logs: buffer and cache sizes, I/O threads, the
# InnoDB page checks, the slow-query log.
#
# Not the same either: live's server clock is CET, this one's is Windows'
# (MySQL on Windows knows no zone names without tables of them). Harmless as
# long as the code compares a stored time with the database's own NOW() and
# CURDATE(), as it does.

[client]
port = 3306
default-character-set = utf8mb4

[mysqld]
# --- as live ---
# Not strict, and no ONLY_FULL_GROUP_BY: MySQL 8.0's default is both.
sql_mode = ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
character-set-server = utf8mb4
collation-server = utf8mb4_general_ci
innodb_strict_mode = OFF
max_allowed_packet = 64M
default_authentication_plugin = mysql_native_password
# information_schema's row counts and AUTO_INCREMENT values are current, not
# up to a day old.
information_schema_stats_expiry = 0
# The size a MEMORY table, or an in-memory temporary one, may reach.
max_heap_table_size = 3G
tmp_table_size = 3G
thread_stack = 512K
performance_schema = OFF
innodb_flush_log_at_trx_commit = 2

# --- this machine's ---
basedir = "{dev}/mysql"
datadir = "{dev}/data"
port = 3306
# Reachable from this machine alone (its root account has no password), and
# without the X Protocol's port (33060). Both loopback addresses: Windows tries
# ::1 first for "localhost", and a refused try costs two seconds.
bind-address = 127.0.0.1,::1
mysqlx = OFF
# Live's is 0: table names are case-sensitive there. Windows allows only 1
# (stored in lower case); every table this site has is lower case anyway.
lower_case_table_names = 1
