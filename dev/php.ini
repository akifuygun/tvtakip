; PHP for local development, set like live's (hostUNO, PHP 8.3). setup-dev.bat
; installs the PHP version live runs and copies this file next to it, as
; {dev}\php\php.ini - run it again after changing anything here.
;
; Below "as live": what live's php.ini changes from PHP's own defaults (`php -n`
; against `php` there, compared on 2026-11-20); everything not named here is
; PHP's default on both. What live's web PHP (PHP-FPM) sets on top of this -
; disable_functions, open_basedir, the time limit, output buffering -
; start-dev.bat gives the dev server on its command line: the command-line
; scripts run without those, there as here.

[PHP]
; --- as live ---
; E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED; includes/errors.php sets E_ALL.
error_reporting = 22519
display_startup_errors = Off
log_errors = Off
memory_limit = 512M
post_max_size = 2048M
upload_max_filesize = 2048M
max_file_uploads = 50
max_input_vars = 10000
variables_order = "GPCS"
request_order = "GP"
; 17 digits: json_encode(7.3) gives 7.2999999999999998, there as here.
serialize_precision = 17
realpath_cache_size = 1M
realpath_cache_ttl = 300
zend.assertions = -1
mail.add_x_header = On
url_rewriter.tags = "a=href,area=href,frame=src,input=src,form=fakeentry"
mysqli.allow_local_infile = On

[Date]
date.timezone = Europe/Warsaw

[Session]
session.gc_divisor = 1000
session.save_path = "{dev}\tmp"

; --- this machine's ---
[PHP]
extension_dir = "{dev}\php\ext"
sys_temp_dir = "{dev}\tmp"
upload_tmp_dir = "{dev}\tmp"

; The certificates HTTPS requests are checked against (TMDB, TVmaze, TheTVDB):
; Mozilla's list, as curl's site publishes it. Live has its system's.
[curl]
curl.cainfo = "{dev}\cacert.pem"
[openssl]
openssl.cafile = "{dev}\cacert.pem"

; Live's extensions, as far as PHP for Windows has them. Live also has PECL
; ones Windows' PHP doesn't ship (apcu, imagick, memcached, redis, mongodb and
; others, which this site doesn't use), and pcntl and posix, which don't exist
; on Windows.
[PHP]
extension = bz2
extension = curl
extension = exif
extension = fileinfo
extension = ftp
extension = gd
extension = gettext
extension = gmp
extension = imap
extension = intl
extension = ldap
extension = mbstring
extension = mysqli
extension = odbc
extension = openssl
extension = pdo_mysql
extension = pdo_pgsql
extension = pdo_sqlite
extension = pgsql
extension = soap
extension = sockets
extension = sodium
extension = sqlite3
extension = tidy
extension = xsl
extension = zip

[opcache]
zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 0
; Live looks at a changed file after 2 seconds; here at once, so a page asked
; for right after an edit is never the old code.
opcache.revalidate_freq = 0
